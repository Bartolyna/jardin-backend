# Docker Compose para ambiente de producción

services:
  # Base de datos PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: jardin_db_prod
    restart: unless-stopped
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME:-jardin_db}
      POSTGRES_USER: ${DB_USER:-jardin_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-jardin*12345}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=es_ES.UTF-8 --lc-ctype=es_ES.UTF-8"
      TZ: America/Bogota
    networks:
      - jardin_network_prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-jardin_user} -d ${DB_NAME:-jardin_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Aplicación Django en modo producción
  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: jardin-web:prod
    container_name: jardin_web_prod
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - static_volume_prod:/app/staticfiles
      - media_volume_prod:/app/mediafiles
      - ./app/logs:/app/logs
    env_file:
      - .env.prod
    depends_on:
      db:
        condition: service_healthy
    networks:
      - jardin_network_prod
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Servidor web Nginx
  nginx:
    image: nginx:1.25-alpine
    container_name: jardin_nginx_prod
    restart: unless-stopped
    volumes:
      - ./nginx-prod.conf:/etc/nginx/conf.d/default.conf
      - static_volume_prod:/app/staticfiles
      - media_volume_prod:/app/mediafiles
      - ./ssl:/etc/nginx/ssl
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
    networks:
      - jardin_network_prod
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data_prod:
    driver: local
  static_volume_prod:
  media_volume_prod:

networks:
  jardin_network_prod:
    driver: bridge