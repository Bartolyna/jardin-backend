# Docker Compose para ambiente local

services:
  # Base de datos PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: jardin_db_local
    restart: unless-stopped
    volumes:
      - postgres_data_local:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: jardin_db_local
      POSTGRES_USER: jardin_user
      POSTGRES_PASSWORD: jardin*12345
      TZ: America/Bogota
    ports:
      - "5433:5432"
    networks:
      - jardin_network_local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jardin_user -d jardin_db_local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Aplicación Django en modo local
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: jardin-web:local
    container_name: jardin_web_local
    restart: unless-stopped
    volumes:
      - ./app:/app
      - static_volume_local:/app/staticfiles
      - media_volume_local:/app/mediafiles
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - jardin_network_local
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Servidor web Nginx (opcional para local)
  nginx:
    image: nginx:1.25-alpine
    container_name: jardin_nginx_local
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume_local:/app/staticfiles
      - media_volume_local:/app/mediafiles
    ports:
      - "80:80"
    depends_on:
      - web
    networks:
      - jardin_network_local
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data_local:
    driver: local
  static_volume_local:
  media_volume_local:

networks:
  jardin_network_local:
    driver: bridge